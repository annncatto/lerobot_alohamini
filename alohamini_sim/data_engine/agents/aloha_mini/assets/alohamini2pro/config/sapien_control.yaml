schema_version: 1
control_frequency: 250
mode: position

# Stiffness/damping remain simulation defaults. Rated velocity/force values are
# traced in actuator_parameters.yaml and still require voltage-specific tests.
joint_groups:
  virtual_base:
    joints: [root_x_axis_joint, root_y_axis_joint, root_z_rotation_joint]
    stiffness: 1000.0
    damping: 200.0
    force_limit: 500.0
    velocity_limit: 1.0
    drive_mode: force
    calibrated: false

  lift:
    joints: [vertical_move]
    stiffness: 1000.0
    damping: 200.0
    force_limit: 74.2
    velocity_limit: 0.05
    drive_mode: force
    gravity_compensation: true
    calibrated: false

  arms:
    joints:
      - left_shoulder_pan
      - left_shoulder_lift
      - left_elbow_flex
      - left_wrist_flex
      - left_wrist_yaw_joint
      - left_wrist_roll
      - right_shoulder_pan
      - right_shoulder_lift
      - right_elbow_flex
      - right_wrist_flex
      - right_wrist_yaw_joint
      - right_wrist_roll
    stiffness: 1000.0
    damping: 200.0
    force_limit: 1.57
    force_limit_by_joint:
      left_shoulder_lift: 2.21
      left_elbow_flex: 2.21
      right_shoulder_lift: 2.21
      right_elbow_flex: 2.21
    force_limit_by_servo_nm: {sts3250: 1.57, sts3095_c002: 2.21}
    velocity_limit_by_servo_rad_s:
      sts3250: 4.2
      sts3095_c002: 2.48
    drive_mode: force
    calibrated: false

  grippers:
    joints: [left_gripper, right_gripper]
    stiffness: 1000.0
    damping: 200.0
    force_limit: 1.57
    velocity_limit: 4.2
    drive_mode: force
    calibrated: false
