        - "root_x_axis_joint"
        - "root_y_axis_joint"
        - "root_z_rotation_joint"
        - "vertical_move"
        - "left_shoulder_pan"
        - "left_shoulder_lift"
        - "left_elbow_flex"
        - "left_wrist_flex"
        - "left_wrist_yaw_joint"
        - "left_wrist_roll"
        - "left_gripper"
        - "right_shoulder_pan"
        - "right_shoulder_lift"
        - "right_elbow_flex"
        - "right_wrist_flex"
        - "right_wrist_yaw_joint"
        - "right_wrist_roll"
        - "right_gripper"
      retract_config: [0.0, 0.0, 0.0, 0.2, 0.0, -1.745, 1.571, 0.349, 0.0, 0.0, -1.8030294104, 0.0, -1.745, 1.571, 0.349, 0.0, 0.0, -1.8030294104]
